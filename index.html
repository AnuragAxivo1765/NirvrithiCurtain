<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Nirvrithi Charitable Trust</title>
  <meta name="description" content="Nirvrithi Charitable Trust - Cancer Support & Palliative Care. Pookoya Thangal Hospice, an initiative of IUML. Coming Soon.">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-lavender: #8b5cf6;
      --accent-pink: #ec4899;
      --emerald-dark: #047857;
      --bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.07) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      text-align: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffffff;
      padding: 4px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.8);
      margin-bottom: 1.25rem;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Ribbon / Theme Tag */
    .theme-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      background: #ffffff;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #7c3aed;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(139, 92, 246, 0.05);
    }

    /* Title & Affiliation */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .affiliation {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--emerald-dark);
      margin-bottom: 0.75rem;
    }

    .coming-soon-pill {
      display: inline-block;
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #059669);
      padding: 0.4rem 1.2rem;
      border-radius: 100px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
    }

    /* Flyer Showcase */
    .flyer-card {
      width: 100%;
      background: #ffffff;
      padding: 0.75rem;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .flyer-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.16);
    }

    .flyer-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    /* Minimal Footer */
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--emerald-dark);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Logo -->
    <div class="logo-wrapper">
      <img src="assets/logo.png" alt="Nirvrithi Charitable Trust & Pookoya Thangal Hospice Logo">
    </div>

    <!-- Cancer Support Badge -->
    <div class="theme-badge">
      <span>🎗️ Cancer Support &amp; Palliative Care</span>
    </div>

    <!-- Title -->
    <h1>Nirvrithi Charitable Trust</h1>

    <!-- Affiliation -->
    <div class="affiliation">
      Pookoya Thangal Hospice &bull; An Initiative of IUML
    </div>

    <!-- Coming Soon -->
    <div class="coming-soon-pill">
      Coming Soon
    </div>

    <!-- Flyer -->
    <div class="flyer-card">
      <img src="assets/flyer.png" alt="Nirvrithi Charitable Trust - Grand Launch Flyer">
    </div>

    <!-- Minimal Contact / Footer -->
    <footer>
      <div>Mannancherry, Alappuzha &bull; Helpline: <a href="tel:+919633709243">+91 96337 09243</a></div>
      <div><a href="https://nirvrithitrust.in" target="_blank" rel="noopener">nirvrithitrust.in</a></div>
    </footer>

  </div>

</body>
</html>
